name: Garmin sync

# Pulls yesterday + today from Garmin into Supabase several times a day, so last night's
# sleep shows up in the morning and workouts show up a few hours after they happen.
# Times are UTC. In New York time (EDT) that's 7:30, 10:30, 13:30, 16:30, 19:30 and 22:30;
# one hour earlier in winter (EST).
on:
  schedule:
    - cron: "30 11,14,17,20,23 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to sync (use 30 for the first load)"
        default: "2"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: garmin-sync
    env:
      TZ: America/New_York # so "today" means your day, not UTC's
      GARMINTOKENS: ${{ secrets.GARMIN_TOKENS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PLATE_USER_ID: ${{ secrets.PLATE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garmin-sync/requirements.txt
      - run: pip install -r requirements.txt
      - run: python sync.py "${{ github.event.inputs.days || '2' }}"
